# The Desktop Execution Engine is disabled — Orchestrator's
# AutomationPort stays NullAutomationPort unless enabled: true here.
# See docs/architecture.md's Phase 15 section. Which requester
# (default: "cowork") may use which action category is governed by
# permissions.yaml, not this file — see PermissionsConfig.

enabled: false

audit_log_path: logs/execution_audit.jsonl

# Deny-by-default: the terminal category refuses every command until
# its executable name is added here explicitly.
terminal:
  allowed_commands: []
  timeout_seconds: 30.0

# The Browser Agent (Phase 16) — a second, independent enable flag:
# needs the 'browser' extra AND a `playwright install <engine>` binary
# download, so it can stay off even when the rest of the engine is on.
browser:
  enabled: false
  engine: chromium
  headless: true
  download_dir: data/browser/downloads
  timeout_seconds: 30.0
  search_url_template: "https://html.duckduckgo.com/html/?q={query}"

default_requester: cowork
