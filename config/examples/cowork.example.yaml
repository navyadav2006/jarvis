# Example cowork.yaml with the integration turned on. Set COWORK_API_KEY
# in the environment before enabling — it is never read from this file.

enabled: true

# This household prefers Sonnet for Cowork requests — cheaper, still
# supports structured outputs, and most household commands don't need
# Opus-tier reasoning.
model: claude-sonnet-5

base_url: https://api.anthropic.com
endpoint_path: /v1/messages
api_key_env_var: COWORK_API_KEY

# A bit more patient than the shipped default, and one extra retry —
# this deployment tolerates slower responses in exchange for fewer
# spurious fallbacks to "I don't know how to do that."
timeout_seconds: 45.0
max_retries: 3
retry_backoff_seconds: 1.5

# Anything the local intent recognizer is less than 40% confident
# about gets offered to Cowork before falling back to "unhandled".
min_confidence_for_local: 0.4
