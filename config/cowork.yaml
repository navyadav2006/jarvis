# Cowork talks directly to the real Claude API (POST /v1/messages via
# the official `anthropic` SDK) — see core/cowork/http_transport.py.
# The API key is never stored here: set the environment variable named
# below instead (e.g. in .env).

enabled: true

# Which Claude model handles requests the local intent recognizer
# couldn't match. claude-opus-5 supports structured outputs, which is
# how its replies get turned into a plan of steps Jarvis executes.
model: claude-opus-5

base_url: https://api.anthropic.com
endpoint_path: /v1/messages
api_key_env_var: COWORK_API_KEY

timeout_seconds: 30.0
max_retries: 2
retry_backoff_seconds: 1.0

min_confidence_for_local: 0.4
